<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131e29"/>
      <stop offset="0.55" stop-color="#243a4f"/>
      <stop offset="1" stop-color="#3d5a74"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4bc6a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f4bc6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8cf8a"/>
      <stop offset="1" stop-color="#eda54e"/>
    </linearGradient>
    <linearGradient id="pathFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9cdb0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9cdb0" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="220" cy="120" r="2.2" opacity="0.5"/>
    <circle cx="410" cy="210" r="1.6" opacity="0.35"/>
    <circle cx="640" cy="90" r="1.8" opacity="0.45"/>
    <circle cx="820" cy="170" r="1.4" opacity="0.3"/>
    <circle cx="960" cy="70" r="2" opacity="0.4"/>
    <circle cx="1180" cy="150" r="1.5" opacity="0.35"/>
    <circle cx="1420" cy="100" r="2" opacity="0.5"/>
    <circle cx="1650" cy="190" r="1.6" opacity="0.4"/>
    <circle cx="1780" cy="80" r="1.8" opacity="0.45"/>
    <circle cx="1520" cy="260" r="1.4" opacity="0.3"/>
    <circle cx="330" cy="330" r="1.5" opacity="0.25"/>
    <circle cx="90" cy="260" r="1.7" opacity="0.35"/>
  </g>

  <!-- 朝阳与光晕 -->
  <circle cx="1210" cy="690" r="300" fill="url(#sunGlow)"/>
  <circle cx="1210" cy="690" r="105" fill="url(#sunBody)"/>

  <!-- 飞鸟 -->
  <g stroke="#101b26" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 1020 330 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M 1120 280 q 11 -10 22 0 q 11 -10 22 0"/>
    <path d="M 960 400 q 9 -8 18 0 q 9 -8 18 0"/>
  </g>

  <!-- 远山（最远层，带晨雾感） -->
  <path d="M 0 760 L 240 700 L 470 755 L 700 685 L 930 750 L 1150 700 L 1400 760 L 1650 705 L 1920 755 L 1920 1080 L 0 1080 Z"
        fill="#42627f" opacity="0.85"/>

  <!-- 中景山丘 -->
  <path d="M 0 850 C 260 780, 520 800, 760 845 C 1000 890, 1240 800, 1500 830 C 1700 852, 1820 838, 1920 848 L 1920 1080 L 0 1080 Z"
        fill="#2c4358"/>

  <!-- 近景丘陵 -->
  <path d="M 0 960 C 300 900, 620 915, 940 965 C 1260 1015, 1600 940, 1920 985 L 1920 1080 L 0 1080 Z"
        fill="#1e2f3e"/>

  <!-- 蜿蜒小路：从近景通向朝阳 -->
  <path d="M 690 1080
           C 760 1010, 930 990, 1020 955
           C 1110 920, 1150 880, 1185 820
           C 1205 780, 1200 745, 1208 706
           L 1216 706
           C 1214 750, 1230 785, 1258 822
           C 1300 880, 1380 920, 1520 958
           C 1640 990, 1730 1030, 1790 1080
           Z"
        fill="url(#pathFade)"/>

  <!-- 近景松树剪影 -->
  <g fill="#13222e">
    <path d="M 150 1010 L 178 940 L 206 1010 Z"/>
    <path d="M 150 975 L 178 905 L 206 975 Z"/>
    <rect x="173" y="1005" width="10" height="18"/>
    <path d="M 285 1040 L 308 985 L 331 1040 Z"/>
    <path d="M 285 1012 L 308 962 L 331 1012 Z"/>
    <rect x="302" y="1035" width="9" height="15"/>
    <path d="M 1690 1030 L 1720 950 L 1750 1030 Z"/>
    <path d="M 1690 990 L 1720 912 L 1750 990 Z"/>
    <rect x="1714" y="1024" width="11" height="20"/>
    <path d="M 1560 1050 L 1582 1000 L 1604 1050 Z"/>
    <path d="M 1560 1024 L 1582 980 L 1604 1024 Z"/>
    <rect x="1577" y="1045" width="9" height="14"/>
  </g>
</svg>
