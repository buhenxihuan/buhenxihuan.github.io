<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131e2a"/>
      <stop offset="0.6" stop-color="#233649"/>
      <stop offset="1" stop-color="#33506a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe9f2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#dfe9f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4257"/>
      <stop offset="0.35" stop-color="#1d3040"/>
      <stop offset="1" stop-color="#13202b"/>
    </linearGradient>
    <linearGradient id="horizonBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#51789b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#51789b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#51789b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="180" cy="150" r="2" opacity="0.5"/>
    <circle cx="330" cy="90" r="1.6" opacity="0.4"/>
    <circle cx="560" cy="200" r="1.8" opacity="0.4"/>
    <circle cx="760" cy="120" r="1.5" opacity="0.35"/>
    <circle cx="900" cy="260" r="1.7" opacity="0.3"/>
    <circle cx="1080" cy="90" r="2" opacity="0.45"/>
    <circle cx="1300" cy="180" r="1.5" opacity="0.35"/>
    <circle cx="1500" cy="110" r="1.8" opacity="0.4"/>
    <circle cx="1700" cy="240" r="1.6" opacity="0.35"/>
    <circle cx="1830" cy="140" r="2" opacity="0.5"/>
    <circle cx="1180" cy="320" r="1.4" opacity="0.25"/>
    <circle cx="250" cy="320" r="1.4" opacity="0.25"/>
  </g>

  <!-- 月亮（弦月）与光晕 -->
  <circle cx="500" cy="240" r="210" fill="url(#moonGlow)"/>
  <circle cx="500" cy="240" r="88" fill="#e9eef4"/>
  <circle cx="534" cy="216" r="76" fill="#1c2f40"/>

  <!-- 薄云 -->
  <g fill="#3f5f7d" opacity="0.28">
    <ellipse cx="700" cy="300" rx="230" ry="16"/>
    <ellipse cx="1250" cy="220" rx="300" ry="18"/>
    <ellipse cx="430" cy="420" rx="180" ry="13"/>
  </g>

  <!-- 海平线光带 -->
  <rect x="0" y="600" width="1920" height="80" fill="url(#horizonBand)"/>

  <!-- 海面 -->
  <rect x="0" y="640" width="1920" height="440" fill="url(#sea)"/>

  <!-- 远处山影 -->
  <path d="M 1180 640 L 1330 592 L 1470 638 L 1600 600 L 1740 640 Z" fill="#16242f" opacity="0.9"/>
  <path d="M 40 640 L 170 604 L 300 640 Z" fill="#16242f" opacity="0.75"/>

  <!-- 月光倒影 -->
  <g stroke="#dbe5ee" stroke-linecap="round">
    <line x1="452" y1="665" x2="548" y2="665" stroke-width="5" opacity="0.5"/>
    <line x1="470" y1="690" x2="530" y2="690" stroke-width="4" opacity="0.42"/>
    <line x1="440" y1="718" x2="560" y2="718" stroke-width="5" opacity="0.34"/>
    <line x1="468" y1="750" x2="532" y2="750" stroke-width="4" opacity="0.28"/>
    <line x1="430" y1="788" x2="570" y2="788" stroke-width="5" opacity="0.22"/>
    <line x1="472" y1="830" x2="528" y2="830" stroke-width="4" opacity="0.17"/>
    <line x1="440" y1="880" x2="560" y2="880" stroke-width="5" opacity="0.12"/>
    <line x1="480" y1="940" x2="520" y2="940" stroke-width="4" opacity="0.08"/>
  </g>

  <!-- 海面波光 -->
  <g stroke="#7ea6c9" stroke-linecap="round" opacity="0.16">
    <line x1="200" y1="700" x2="330" y2="700" stroke-width="3"/>
    <line x1="820" y1="730" x2="960" y2="730" stroke-width="3"/>
    <line x1="1350" y1="700" x2="1470" y2="700" stroke-width="3"/>
    <line x1="1050" y1="780" x2="1210" y2="780" stroke-width="3"/>
    <line x1="300" y1="820" x2="450" y2="820" stroke-width="3"/>
    <line x1="1500" y1="840" x2="1660" y2="840" stroke-width="3"/>
    <line x1="760" y1="900" x2="920" y2="900" stroke-width="3"/>
    <line x1="1180" y1="970" x2="1360" y2="970" stroke-width="3"/>
    <line x1="360" y1="1010" x2="540" y2="1010" stroke-width="3"/>
    <line x1="1600" y1="1030" x2="1760" y2="1030" stroke-width="3"/>
  </g>

  <!-- 帆船剪影 -->
  <g fill="#0d1822">
    <path d="M 1140 640 L 1246 640 L 1226 668 L 1160 668 Z"/>
    <path d="M 1192 632 L 1192 496 L 1240 628 Z"/>
    <path d="M 1182 632 L 1182 516 L 1144 628 Z"/>
  </g>

  <!-- 海鸥 -->
  <g stroke="#0e1922" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 1380 420 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M 1480 370 q 11 -10 22 0 q 11 -10 22 0"/>
    <path d="M 620 500 q 9 -8 18 0 q 9 -8 18 0"/>
  </g>
</svg>
